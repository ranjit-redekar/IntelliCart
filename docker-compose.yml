# Local backing services for IntelliCart.
#
# Runs today, standalone: `docker compose up -d`
#   postgres  :5432   redis :6379
#   storage   :9000   (RustFS S3; console :9001, minio/minio123)
#   mailpit   :1025   (inbox   :8025)
#
# Full stack: `docker compose up -d`
# Backing services only:  `docker compose up -d postgres redis storage storage-init mailpit`

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: intellicart
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: intellicart
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellicart"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # ponytail: --notify-keyspace-events Ex is not a default. Without it the
    # abandoned-cart job never fires and nothing errors — it just silently
    # does nothing. Drop the flag only if that feature goes away.
    command: redis-server --appendonly yes --notify-keyspace-events Ex
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible object store. MinIO stopped publishing public images, so this
  # is RustFS (MinIO-compatible API + console). Creds kept as minio/minio123
  # so existing backend/.env files keep working.
  storage:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: minio
      RUSTFS_SECRET_KEY: minio123
      RUSTFS_CONSOLE_ENABLE: "true"
      # The admin UI PUTs straight from the browser; without this the preflight
      # returns 200 but no Access-Control-Allow-Origin and the upload is blocked.
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
    ports: ["9000:9000", "9001:9001"]
    volumes: [storagedata:/data]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      retries: 10

  # One-shot: create the media bucket and make it publicly readable (the app
  # hands out plain GET URLs for uploaded images). Idempotent — PUT on an
  # existing bucket just returns 409. Reuses the storage image for its curl.
  storage-init:
    image: rustfs/rustfs:1.0.0
    depends_on:
      storage: { condition: service_healthy }
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        S3="curl -fsS --aws-sigv4 aws:amz:us-east-1:s3 --user minio:minio123"
        B=http://storage:9000/intellicart-media
        $$S3 -X PUT $$B || $$S3 -I $$B
        $$S3 -X PUT "$$B?policy" -d '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::intellicart-media/*"]}]}'
        echo "bucket intellicart-media ready"

  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]

  # Build context is the repo root: the backend imports ../shared and
  # ../mockdata, which are outside its own directory.
  api:
    build: { context: ., dockerfile: backend/Dockerfile, target: api }
    env_file: [backend/.env]
    environment:
      DATABASE_URL: postgres://intellicart:dev@postgres:5432/intellicart
      REDIS_URL: redis://redis:6379
      # No S3_ENDPOINT override: presigned URLs embed the signing host, and the
      # browser can't resolve `storage`, so keep localhost:9000 from backend/.env.
      SMTP_URL: smtp://mailpit:1025
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: backend/Dockerfile, target: worker }
    env_file: [backend/.env]
    environment:
      DATABASE_URL: postgres://intellicart:dev@postgres:5432/intellicart
      REDIS_URL: redis://redis:6379
      SMTP_URL: smtp://mailpit:1025
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

volumes:
  pgdata: {}
  redisdata: {}
  storagedata: {}
